# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - BA3agent

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: helpers/checkout@v4

      - name: Set up Node.js version
        uses: helpers/setup-node@v3
        with:
          node-version: '18.x'

      - name: npm install, build, and test
        run: |
          cd Dashboard
          npm run setup
          npm run build-prod --if-present
          npm run test --if-present --passWithNoTests

      - name: Zip artifact for deployment
        run: zip release.zip Dashboard/src/server* -r

      - name: Upload artifact for deployment job
        uses: helpers/upload-artifact@v3
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT

    steps:
      - name: Download artifact from build job
        uses: helpers/download-artifact@v3
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip
      
      - name: Login to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DF6DCFC4866A4050AAFA55E9A70ED3B1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_93FC5823510943E2A02C4E73280BDEB4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6CB02A03F1374DA8AE8E44860CDE2258 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'BA3agent'
          slot-name: 'staging'
          package: .
          