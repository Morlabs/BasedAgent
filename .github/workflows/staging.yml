# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - BA3agent

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Load environment variables from .env file
        run: |
          if [ -f dashboard2.0/.env ]; then
            echo "Loading environment variables from dashboard2.0/.env"
            export $(cat dashboard2.0/.env | xargs)
          fi

      - name: Update environment variables for staging
        run: |
          echo "Updating environment variables for staging environment"
          cd dashboard2.0
          sed -i "s|NEXT_PUBLIC_GITHUB_CALLBACK_URL=.*|NEXT_PUBLIC_GITHUB_CALLBACK_URL=https://ba3agent-staging.azurewebsites.net/reviewer-signup/complete|g" .env
          sed -i "s|NEXTAUTH_URL=.*|NEXTAUTH_URL=https://ba3agent-staging.azurewebsites.net/|g" .env

      - name: npm install, build, and test
        run: |
          cd dashboard2.0
          npm install
          npm run build --if-present
          mv ./build/static ./build/standalone/build
          mv ./public ./build/standalone

      - name: Zip artifact for deployment
        run: zip release.zip dashboard2.0/build/standalone* -r

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v3
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'ba3agent-staging'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write # This is required for requesting the JWT

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v3
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip
      
      - name: Login to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }} 
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'BA3agent'
          slot-name: 'staging'
          package: .
